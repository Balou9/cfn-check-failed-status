AWSTemplateFormatVersion: 2010-09-09
Description: cfn-check-failed-status UPDATE_ROLLBACK_COMPLETE test stack
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Storage
        Parameters:
          - CfnCheckStatusBucketName

Parameters:
  CfnCheckStatusBucketName:
    Description: Name of the test bucket
    Type: String

Resources:
  CfnCheckStatusBucketA:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${CfnCheckStatusBucketName}-a"
      # AccessControl: PublicRead
    DeletionPolicy: Delete

  CfnCheckStatusBucketB:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${CfnCheckStatusBucketName}-b"
      # AccessControl: PublicRead
    DeletionPolicy: Delete